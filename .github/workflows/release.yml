name: Release

# Push a tag like v0.4.0 (matching "version" in package.json) to publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:integration

  release:
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check that the tag matches package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package
        run: npx vsce package --out "switchboard-accounts-${{ steps.version.outputs.version }}.vsix"

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::No CHANGELOG.md section for $VERSION"; exit 1; fi
          cat >> notes.md <<EOF

          ### Install
          Download \`switchboard-accounts-$VERSION.vsix\` below, then in VS Code run **Extensions: Install from VSIX…**, or:
          \`\`\`
          code --install-extension switchboard-accounts-$VERSION.vsix
          \`\`\`
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "switchboard-accounts-${{ steps.version.outputs.version }}.vsix" \
            --title "Switchboard ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag

      # Optional: add these repository secrets to also publish to the marketplaces.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath "switchboard-accounts-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0.10.1 publish "switchboard-accounts-${{ steps.version.outputs.version }}.vsix" --pat "$OVSX_PAT"
